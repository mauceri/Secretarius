# install.conf — Configuration par défaut pour l'installation de Secretarius
# Sourcé par install.sh et openclaw-config/install.sh

SECRETARIUS_VERSION="0.1.0"

# Chemin du coffre Obsidian
# Coffre Obsidian : défaut dérivé du profil ($HOME/Documents/$COFFRE) par install.sh
OBSIDIAN_PATH="${OBSIDIAN_PATH:-}"

# Nom de l'assistant OpenClaw
ASSISTANT_NAME="${ASSISTANT_NAME:-Tiron}"

# Chemin où installer la config OpenClaw
OPENCLAW_PATH="${OPENCLAW_PATH:-$HOME/.openclaw}"

# Version minimale d'OpenClaw requise
OPENCLAW_MIN_VERSION="1.0.0"

# Chemins relatifs au repo
OPENCLAW_CONFIG_PATH="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/openclaw-config"
WIKI_LM_PATH="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/Wiki_LM"

# Cerveau de l'agent principal : fixé par le profil (profils/*.conf),
# MAIN_BRAIN=ollama|modal. Modèle Ollama utilisé quand MAIN_BRAIN=ollama :
OLLAMA_MAIN_MODEL="${OLLAMA_MAIN_MODEL:-qwen3:8b}"

# Jeton du proxy Modal obfusqué (obfuscator-proxy-8b.service, ~/obfuscator) —
# requis par le module obfuscateur. Même valeur que le secret Modal
# aloepri-api-key ; voir ~/obfuscator/docs/DISASTER-RECOVERY.md.
ALOEPRI_API_KEY="${ALOEPRI_API_KEY:-}"

# Checkpoint Hugging Face du classifieur Laya du routeur de commandes
# (tiron-router) — indépendant du cerveau ci-dessus, cf.
# docs/superpowers/specs/2026-09-28-routeur-laya-design.md.
LAYA_CHECKPOINT="${LAYA_CHECKPOINT:-Mauceric/laya-tiron-router}"
